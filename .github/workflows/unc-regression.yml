# Runs only the Uncountable fork's own regression specs, so the result is a clean
# pass/fail signal for our changes. The FullScale workflow runs the whole upstream
# suite, where hundreds of unrelated upstream failures hide our result.

name: Version Upgrade Regression Verification

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:

env:
  # Warnings breaks build on CI
  # See: https://github.com/orgs/community/discussions/25228#discussioncomment-3246960
  CI: false
  MODE: standalone
  KETCHER_URL: http://127.0.0.1:4002
  DOCKER: true
  IGNORE_UNSTABLE_TESTS: true
  CI_ENVIRONMENT: true
  USE_SEPARATE_INDIGO_WASM: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Bookworm, not bullseye: the bullseye security pool no longer serves the
    # package versions its own index advertises, so apt-get install fails there.
    container: node:24.14.1-bookworm-slim
    steps:
      - name: Install dependencies
        run: apt-get update -y && apt-get install -y git
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Git safe
        run: git config --global --add safe.directory '*'
      - name: Install NPM dependencies
        run: npm ci
      - name: Build all packages
        run: npm run build:packages && npm run build:example:standalone
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ketcher-dist-unc-regression
          path: example/dist

  run:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: build
    container: mcr.microsoft.com/playwright:v1.44.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        run: npm ci
      - name: Create folder for dist
        run: mkdir -p example/dist
      - name: Download compiled ketcher
        uses: actions/download-artifact@v4
        with:
          name: ketcher-dist-unc-regression
          path: example/dist/
      - name: Create env file
        run: |
          cat > ketcher-autotests/.env << EOF
          DOCKER=true
          KETCHER_URL=$KETCHER_URL
          MODE=$MODE
          IGNORE_UNSTABLE_TESTS=$IGNORE_UNSTABLE_TESTS
          CI_ENVIRONMENT=$CI_ENVIRONMENT
          USE_SEPARATE_INDIGO_WASM=$USE_SEPARATE_INDIGO_WASM
          EOF
      - name: Run the fork regression specs
        run: |
          cd example/ && nohup npm run serve:standalone &
          cd ketcher-autotests/
          npm i
          npx playwright install chromium
          npx playwright test --project=chromium tests/specs/unc-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unc-regression-report
          path: ketcher-autotests/playwright-report/
          retention-days: 5
